global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity-service:8081"]
  - job_name: profile-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["profile-service:8085"]
  - job_name: catalog-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["catalog-service:8086"]
  - job_name: marketplace-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["marketplace-service:8082"]
  - job_name: booking-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["booking-service:8083"]
  - job_name: review-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["review-service:8088"]
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8087"]
  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8084"]
