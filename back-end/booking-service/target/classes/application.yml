server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:mysql://localhost:3306/doan1_booking?serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true

security:
  jwt:
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64}

service:
  api-keys:
    profile: ${BOOKING_PROFILE_API_KEY:}
    marketplace: ${MARKETPLACE_BOOKING_API_KEY:}
    catalog: ${BOOKING_CATALOG_API_KEY:}

services:
  profile:
    url: ${PROFILE_SERVICE_URL:http://localhost:8085}
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8086}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: booking-service

app:
  outbox:
    enabled: ${BOOKING_OUTBOX_ENABLED:true}
    poll-interval-ms: ${BOOKING_OUTBOX_POLL_INTERVAL_MS:1000}
