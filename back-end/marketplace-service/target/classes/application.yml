server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: marketplace-service
  datasource:
    url: ${MARKETPLACE_DB_URL:jdbc:mysql://localhost:3306/doan1_marketplace?serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

security:
  jwt:
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64}

service:
  profile-migration-api-key: ${PROFILE_MIGRATION_API_KEY:}
  api-keys:
    review-migration: ${REVIEW_MIGRATION_API_KEY:}
    booking: ${MARKETPLACE_BOOKING_API_KEY:}
    legacy-booking: ${BOOKING_MARKETPLACE_API_KEY:}
    profile: ${REVIEW_PROFILE_API_KEY:}

services:
  profile:
    url: ${PROFILE_SERVICE_URL:http://localhost:8085}
  booking:
    url: ${BOOKING_SERVICE_URL:http://localhost:8083}

app:
  seed-demo-providers: ${SEED_DEMO_PROVIDERS:true}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: marketplace-service
