server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64}

spring:
  application:
    name: api-gateway

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

services:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  profile:
    url: ${PROFILE_SERVICE_URL:http://localhost:8085}
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8086}
  marketplace:
    url: ${MARKETPLACE_SERVICE_URL:http://localhost:8082}
  review:
    url: ${REVIEW_SERVICE_URL:http://localhost:8088}
  booking:
    url: ${BOOKING_SERVICE_URL:http://localhost:8083}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
