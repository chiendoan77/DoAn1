server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

services:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  marketplace:
    url: ${MARKETPLACE_SERVICE_URL:http://localhost:8082}
  booking:
    url: ${BOOKING_SERVICE_URL:http://localhost:8083}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
