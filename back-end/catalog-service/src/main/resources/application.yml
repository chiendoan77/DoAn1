server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:mysql://localhost:3306/doan1_catalog?serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true

security:
  jwt:
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64}

service:
  api-keys:
    booking: ${CATALOG_BOOKING_API_KEY:}

services:
  profile:
    url: ${PROFILE_SERVICE_URL:http://localhost:8085}
    api-key: ${CATALOG_PROFILE_API_KEY:}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: catalog-service
