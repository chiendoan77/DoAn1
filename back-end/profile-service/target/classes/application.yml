server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: profile-service
  datasource:
    url: ${PROFILE_DB_URL:jdbc:mysql://localhost:3306/doan1_profile?serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

security:
  jwt:
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64}

service:
  api-keys:
    identity: ${PROFILE_IDENTITY_API_KEY:}
    booking: ${BOOKING_PROFILE_API_KEY:}
    catalog: ${CATALOG_PROFILE_API_KEY:}
    review: ${REVIEW_PROFILE_API_KEY:}
  profile-migration-api-key: ${PROFILE_MIGRATION_API_KEY:}
app:
  profile-migration:
    enabled: ${PROFILE_MIGRATION_ENABLED:true}
services:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  marketplace:
    url: ${MARKETPLACE_SERVICE_URL:http://localhost:8082}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
