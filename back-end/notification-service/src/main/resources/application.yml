server:
  port: ${SERVER_PORT:8087}
spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:mysql://localhost:3306/doan1_notification?serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:doan1}
    password: ${RABBITMQ_PASSWORD:doan1-local-only}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_ENABLED:true}

app:
  rabbitmq:
    queue: notifications.catalog
security:
  jwt:
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
